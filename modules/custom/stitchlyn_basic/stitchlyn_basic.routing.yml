stitchlyn_basic.dashboard:
  path: '/dashboard'
  defaults:
    _controller: '\Drupal\stitchlyn_basic\Controller\DashboardController::view'
    _title: 'Dashboard'
  requirements:
    _permission: 'access content'
stitchlyn_basic.profile_form:
  path: '/user/{user}/profiles/{profile_type}/update'
  defaults:
    _controller: '\Drupal\stitchlyn_basic\Controller\ProfileFormController::build'
    _title: 'Manage profile'
  requirements:
    _permission: 'access user profiles'
  options:
    parameters:
      user:
        type: entity:user
stitchlyn_basic.erp_settings:
  path: '/admin/config/erp/client-settings'
  defaults:
    _form: '\Drupal\stitchlyn_basic\Form\ERPClientSettingsForm'
    _title: 'ERP Client Settings'
  requirements:
    _permission: 'administer site configuration'