stitchlyn_quotation.detail:
  path: 'dashboard/quotation/{node}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationController::view'
    _title_callback: '\Drupal\stitchlyn_quotation\Controller\QuotationController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node
stitchlyn_quotation.wo_detail:
  path: 'dashboard/wo/{node}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WOController::view'
    _title_callback: '\Drupal\stitchlyn_quotation\Controller\WOController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node
