stitchlyn_quotation.detail:
  path: '/dashboard/quotation/{node}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationController::view'
    _title_callback: '\Drupal\stitchlyn_quotation\Controller\QuotationController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

stitchlyn_quotation.my_detail:
  path: '/quotation/{node}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationController::my_view'
    _title_callback: '\Drupal\stitchlyn_quotation\Controller\QuotationController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

stitchlyn_quotation.pdf:
  path: '/dashboard/quotation/{node}/pdf'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationController::pdf'
    _title: 'Quotation PDF'
  requirements:
    _entity_access: 'node.view'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

stitchlyn_quotation.wo_detail:
  path: '/dashboard/wo/{node}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WOController::view'
    _title_callback: '\Drupal\stitchlyn_quotation\Controller\WOController::title'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

stitchlyn_quotation.wo_add:
  path: '/dashboard/wo/add'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WOController::add'
    _title: 'Add Work Order'
  requirements:
    _permission: 'create work_order content'

stitchlyn_quotation.wo_edit:
  path: '/dashboard/wo/{node}/edit'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WOController::edit'
    _title_callback: '\Drupal\stitchlyn_quotation\Controller\WOController::title'
  requirements:
    _entity_access: 'node.update'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

# Add new quotation and redirect to edit page
stitchlyn_quotation.add:
  path: '/dashboard/add/quotation'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationAddController::createQuotation'
    _title: 'Add Quotation'
  requirements:
    _permission: 'access content'

# Edit quotation form
stitchlyn_quotation.edit:
  path: '/dashboard/quotation/{node}/edit'
  defaults:
    _form: '\Drupal\stitchlyn_quotation\Form\QuotationEditForm'
    _title_callback: '\Drupal\stitchlyn_quotation\Form\QuotationEditForm::title'
  requirements:
    _permission: 'access content'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

# Load product attribute popup
stitchlyn_quotation.ajax_attributes:
  path: '/quotation/ajax/attributes/{product}/{quotation}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationAjaxController::getAttributeForm'
  requirements:
    _permission: 'access content'

# Save paragraph (AJAX)
stitchlyn_quotation.save_item:
  path: '/quotation/ajax/save-item/{product_id}/{quotation_id}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationAjaxController::saveAttributeItem'
  requirements:
    _permission: 'access content'
  options:
    _format: 'json'

# Refresh table
stitchlyn_quotation.line_items:
  path: '/quotation/ajax/line-items/{quotation_id}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationAjaxController::getLineItems'
  requirements:
    _permission: 'access content'
  options:
    _format: 'json'

# Delete item
stitchlyn_quotation.ajax_delete_item:
  path: '/quotation/ajax/delete-item/{item_id}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationAjaxController::deleteLineItem'
  requirements:
    _permission: 'access content'

# Tax config admin
stitchlyn_quotation.tax_config:
  path: '/admin/config/stitchlyn/tax'
  defaults:
    _form: '\Drupal\stitchlyn_quotation\Controller\TaxConfigController'
    _title: 'Tax Configuration'
  requirements:
    _permission: 'administer site configuration'

stitchlyn_quotation.view_item:
  path: 'quotation/ajax/view-item/{item_id}'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\QuotationAjaxController::viewAttributeItem'
  requirements:
    _permission: 'access content'
stitchlyn_quotation.inventory_autocomplete:
  path: '/inventory/item/autocomplete'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\InventoryController::autocomplete'
  requirements:
    _permission: 'access content'
stitchlyn_quotation.inventory_item_details:
  path: '/inventory/item/details'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\InventoryController::getItemDetails'
    _format: 'json'
  requirements:
    _permission: 'access content'

stitchlyn_quotation.save_inventory_log:
  path: '/quotation/{quotation}/inventory-log/save'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\InventoryController::saveLog'
    _format: 'json'
  requirements:
    _permission: 'access content'

stitchlyn_quotation.delete_inventory_log:
  path: '/inventory-log/{id}/delete'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\InventoryController::deleteLog'
    _format: 'json'
  requirements:
    _permission: 'access content'

stitchlyn_quotation.add_work_order:
  path: '/quotation/{quotation}/work-order/save'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WorkOrderController::saveWorkOrder'
    _format: 'json'
  requirements:
    _permission: 'access content'

stitchlyn_quotation.update_work_order:
  path: '/quotation/work-order/{id}/update'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WorkOrderController::updateWorkOrder'
    _format: 'json'
  requirements:
    _permission: 'access content'
  methods: [POST]

stitchlyn_quotation.get_work_order:
  path: '/quotation/work-order/{id}/view'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WorkOrderController::getWorkOrder'
    _format: 'json'
  requirements:
    _permission: 'access content'

stitchlyn_quotation.line_item_autocomplete:
  path: '/quotation/{quotation}/line-item/autocomplete'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WorkOrderController::lineItemAutocomplete'
    _format: 'json'
  requirements:
    _permission: 'access content'

stitchlyn_quotation.production_unit_autocomplete:
  path: '/production-unit/autocomplete'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WorkOrderController::productionUnitAutocomplete'
    _format: 'json'
  requirements:
    _permission: 'access content'

stitchlyn_quotation.order_status_autocomplete:
  path: '/order-status/autocomplete'
  defaults:
    _controller: '\Drupal\stitchlyn_quotation\Controller\WorkOrderController::orderStatusAutocomplete'
    _format: 'json'
  requirements:
    _permission: 'access content'