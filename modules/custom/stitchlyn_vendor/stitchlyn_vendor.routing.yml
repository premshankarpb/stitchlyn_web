stitchlyn_vendor.add_vendor:
  path: '/dashboard/add/vendor'
  defaults:
    _form: '\Drupal\stitchlyn_vendor\Form\AddVendorForm'
    _title: 'Add Vendor'
  requirements:
    _permission: 'administer users'
stitchlyn_vendor.edit_form:
  path: '/dashboard/edit/vendor/{user}'
  defaults:
    _form: '\Drupal\stitchlyn_vendor\Form\VendorEditForm'
    _title: 'Edit Vendor'
  requirements:
    _permission: 'administer users'
    _entity_access: 'user.update'
  options:
    parameters:
      user:
        type: entity:user
stitchlyn_vendor.inventory_item_form:
  path: '/dashboard/add/inventory'
  defaults:
    _form: '\Drupal\stitchlyn_vendor\Form\InventoryItemForm'
    _title: 'Add Inventory Item'
  requirements:
    _permission: 'access content'
stitchlyn_vendor.autocomplete_inventory:
  path: '/autocomplete/inventory'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\VendorController::handleAutocomplete'
    _title: 'Inventory Autocomplete'
  requirements:
    _permission: 'access content'
stitchlyn_vendor.inventory_detail:
  path: '/dashboard/inventory/{node}'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\InventoryDetailController::view'
    _title: 'Inventory Detail'
  requirements:
    _permission: 'access content'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
stitchlyn_vendor.purchase_order_detail:
  path: '/dashboard/po/{node}'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\PurchaseOrderDetailController::view'
    _title: 'Purchase Order Detail'
  requirements:
    _permission: 'access content'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
stitchlyn_vendor.my_purchase_order_detail:
  path: '/po/{node}'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\PurchaseOrderDetailController::my_view'
    _title: 'Purchase Order Detail'
  requirements:
    _permission: 'access content'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
stitchlyn_vendor.purchase_order_pdf:
  path: '/dashboard/po/{node}/pdf'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\PurchaseOrderDetailController::pdf'
    _title: 'Purchase Order PDF'
  requirements:
    _permission: 'access content'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
stitchlyn_vendor.my_purchase_orders:
  path: '/my_purchase_orders'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\MyPurchaseOrders::view'
    _title_callback: '\Drupal\node\Controller\NodeViewController::title'
  requirements:
    _permission: 'access content'
stitchlyn_vendor.purchase_order_create:
  path: '/dashboard/add/purchase-order'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\PurchaseOrderController::createPurchaseOrder'
    _title: 'Create Purchase Order'
  requirements:
    _permission: 'access content'
stitchlyn_vendor.purchase_order_edit:
  path: '/dashboard/purchase-order/{node}/edit'
  defaults:
    _form: '\Drupal\stitchlyn_vendor\Form\PurchaseOrderEditForm'
    _title: 'Edit Purchase Order'
  requirements:
    _permission: 'access content'
    node: '\d+'
  options:
    parameters:
      node:
        type: entity:node
stitchlyn_vendor.vendor_info:
  path: '/stitchlyn/vendor/info'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\VendorInfoController::getVendorInfo'
  requirements:
    _permission: 'access content'
stitchlyn_vendor.item_info:
  path: '/stitchlyn/item/info'
  defaults:
    _controller: '\Drupal\stitchlyn_vendor\Controller\ItemInfoController::getItemInfo'
  requirements:
    _permission: 'access content'